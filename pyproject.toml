[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specdec"
version = "0.1.0"
description = "Speculative decoding reference implementations, benchmarks and vLLM tooling for faster LLM inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
specdec = "specdec.cli:main"

[tool.setuptools.packages.find]
include = ["specdec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
